squareup-okhttp3-jvm = { group = "com.squareup.okhttp3", name = "okhttp-jvm", version.ref = "okhttp3" }
squareup-okhttp3-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp3" }
squareup-okhttp3-mockewebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp3" }
squareup-retrofit2-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit2" }
squareup-retrofit2-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit2" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
androidx-room = { id = "androidx.room3", version.ref = "room3" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android-plugin = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm-library = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }


[bundles]
compose-ui = [
    "androidx-compose-material3",
    "androidx-compose-ui",
]
network = [
    "kotlinx-serialization-json",
    "squareup-okhttp3",
    "squareup-okhttp3-logging",
    "squareup-retrofit2-converter-kotlinx-serialization",
    "squareup-retrofit2-core",
]
coil = [
    "coil-compose",
    "coil-network-okhttp",
]
junit = "4.13.2"
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
kotlinxDateTime = "0.8.0"
ksp = "2.3.9"
mockitoKotlin = "6.4.0"
okhttp3 = "5.5.0"
paging = "3.5.3"
protobuf = "4.36.2"
protobufPlugin = "0.10.0"
retrofit2 = "3.0.0"
retrofitKotlinxSerializationJson = "1.11.0"
room3 = "3.0.3"
spotless = "8.9.0"


[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "dataStore" }
androidx-paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging" }
androidx-paging-testing = { group = "androidx.paging",name = "paging-testing", version.ref = "paging" }
androidx-room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
